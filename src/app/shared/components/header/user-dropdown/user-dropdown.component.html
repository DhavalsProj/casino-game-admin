<div class="relative">
  <button
    class="flex items-center text-gray-700 dropdown-toggle dark:text-gray-400"
    (click)="toggleDropdown($event)"
    type="button"
    aria-haspopup="menu"
    [attr.aria-expanded]="isOpen"
  >
    <span class="overflow-hidden rounded-full ltr:mr-3 rtl:ml-3 h-11 w-11 shrink-0">
      <img src="/images/user/owner.png" alt="Profile" class="object-cover w-full h-full" />
    </span>
    <span class="block font-medium ltr:mr-1 rtl:ml-1 text-theme-sm">{{ currentUser?.name || 'Account' }}</span>
    <svg
      class="transition-transform duration-200 size-5 text-gray-500 dark:text-gray-400"
      [ngClass]="{ 'rotate-180': isOpen }"
      width="20"
      height="20"
      viewBox="0 0 20 20"
      fill="none"
      aria-hidden="true"
    >
      <path d="M4.79175 7.396L10.0001 12.6043L15.2084 7.396" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  @if (isOpen) {
    <div class="absolute ltr:right-0 rtl:left-0 mt-[17px] flex w-[260px] flex-col rounded-2xl border border-gray-200 bg-white p-3 shadow-theme-lg dark:border-gray-800 dark:bg-gray-dark z-50 animate-fadeIn" role="menu">
      <div class="border-b border-gray-200 pb-3 dark:border-gray-800">
        <span class="block font-medium text-gray-700 text-theme-sm dark:text-gray-400">{{ currentUser?.name || 'Account' }}</span>
        <span class="mt-0.5 block text-theme-xs text-gray-500 dark:text-gray-400">{{ currentUser?.role | titlecase }} · {{ currentUser?.uniqueId }}</span>
      </div>

      <a
        routerLink="/profile/edit"
        (click)="closeDropdown()"
        class="group mt-2 flex items-center gap-3 rounded-lg px-3 py-2 text-theme-sm font-medium text-gray-700 hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300"
        role="menuitem"
      >
        <svg class="size-5 fill-gray-500 group-hover:fill-gray-700 dark:fill-gray-400 dark:group-hover:fill-gray-300" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.5A8.5 8.5 0 0 0 6.13 18.15c.46-2.1 2.33-3.65 4.59-3.65h2.56c2.26 0 4.13 1.55 4.59 3.65A8.5 8.5 0 0 0 12 3.5Zm0-1.5a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 4a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z" />
        </svg>
        Edit profile
      </a>

      <button
        type="button"
        (click)="signOut()"
        class="group mt-2 flex w-full items-center gap-3 rounded-lg border-t border-gray-200 px-3 pt-3 text-start text-theme-sm font-medium text-gray-700 hover:text-gray-900 dark:border-gray-800 dark:text-gray-400 dark:hover:text-white"
        role="menuitem"
      >
        <svg class="size-5 stroke-gray-500 group-hover:stroke-gray-700 dark:stroke-gray-400 dark:group-hover:stroke-gray-300" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M14 8V5.5A2.5 2.5 0 0 0 11.5 3h-5A2.5 2.5 0 0 0 4 5.5v13A2.5 2.5 0 0 0 6.5 21h5a2.5 2.5 0 0 0 2.5-2.5V16M10 12h10m0 0-3.5-3.5M20 12l-3.5 3.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Sign out
      </button>
    </div>
  }
</div>
